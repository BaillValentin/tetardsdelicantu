<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Espèces Corse</title>
<meta name="theme-color" content="#06324a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espèces Corse">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #06324a;
    --bg2: #0a4a6b;
    --text: #f2f8fb;
    --muted: #9cc3d6;
    --ko: #e0603f;
    --ok: #2fa86b;
    --card-back: #f5f1e8;
    --card-text: #0b2c3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, #041f2f 100%);
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);
  }
  .progress { display: flex; align-items: center; gap: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #5fd0f3; border-radius: 4px; transition: width .3s; }
  .count { min-width: 4.5em; text-align: right; color: var(--muted); }

  .stage { flex: 1; min-height: 0; perspective: 1400px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
          transition: transform .45s cubic-bezier(.3,.7,.3,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card.instant { transition: none; }
  .face { position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
          backface-visibility: hidden; -webkit-backface-visibility: hidden;
          box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .front { background: #021722; }
  .front .blur { position: absolute; inset: -30px; background-size: cover; background-position: center;
                 filter: blur(24px) brightness(.7); transform: scale(1.1); }
  .front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .credit { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px 6px;
            font-size: 10px; color: rgba(255,255,255,.75); text-align: right;
            background: linear-gradient(transparent, rgba(0,0,0,.45));
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .zoom-btn { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; min-height: 0; padding: 0;
              border-radius: 50%; background: rgba(0,0,0,.4); display: grid; place-items: center; }
  .zoom-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
  .back { transform: rotateY(180deg); background: var(--card-back); color: var(--card-text);
          display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .back h1 { margin: 0; font-size: clamp(34px, 11vw, 64px); line-height: 1.1; font-weight: 800;
             overflow-wrap: break-word; hyphens: auto; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; border: 0; border-radius: 18px; min-height: 64px; padding: 0 12px;
           font-size: 19px; font-weight: 700; color: #fff; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); filter: brightness(.9); }
  .ko { background: var(--ko); }
  .ok { background: var(--ok); }
  .alt { background: var(--bg2); }

  .end { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
         gap: 14px; text-align: center; }
  .end .score { font-size: 72px; font-weight: 800; line-height: 1; }
  .end .label { color: var(--muted); font-size: 18px; margin-bottom: 24px; }
  .end button { width: 100%; max-width: 420px; }
  .done .stage, .done .actions { display: none; }
  .done .end { display: flex; }

  .icon { flex: none; width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 12px;
          background: rgba(255,255,255,.12); display: grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mode .ic-cards { display: none; }
  .title { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; display: none;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none;
            margin: 0 calc(-1 * env(safe-area-inset-right) - 14px) calc(-1 * env(safe-area-inset-bottom) - 12px)
                    calc(-1 * env(safe-area-inset-left) - 14px);
            padding: 0 calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px)
                     calc(env(safe-area-inset-left) + 14px); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(26vw, 150px), 1fr)); gap: 8px; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block;
              background: #021722; cursor: pointer; }

  /* Écran d'accueil : choix du jeu */
  .home .progress .bar, .home .progress .count, .home .stage, .home .actions, .home .end,
  .home #back, .home #mode { display: none !important; }
  .home .title, .home .decks { display: block; }
  .home .title { font-size: 26px; padding: 4px 0; }
  .deck { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px;
          margin-bottom: 10px; background: rgba(255,255,255,.08); border-radius: 18px; min-height: 0; }
  .deck img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: none; }
  .deck b { display: block; font-size: 19px; }
  .deck small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 3px; }

  /* Mode « toutes les photos » du jeu */
  .browse .progress .bar, .browse .progress .count, .browse .stage, .browse .actions, .browse .end { display: none !important; }
  .browse .title, .browse .gallery { display: block; }
  .browse .mode .ic-grid { display: none; }
  .browse .mode .ic-cards { display: block; }

  /* Visionneuse plein écran avec zoom (pincer, double-toucher) */
  .viewer { position: fixed; inset: 0; z-index: 10; background: rgba(2, 16, 24, .97); display: none;
            flex-direction: column; gap: 14px;
            padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
                     calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 14px); }
  .viewer.open { display: flex; }
  .viewer .close { align-self: flex-end; }
  .zoom { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; border-radius: 16px; }
  .zoom img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
              transform-origin: 0 0; will-change: transform; }
  .viewer h2 { margin: 0; font-size: clamp(30px, 9vw, 52px); font-weight: 800; text-align: center; line-height: 1.1; }
  .viewer.nameless h2 { display: none; }
  .viewer .credit { position: static; background: none; padding: 0; }
</style>
</head>
<body>
<div class="app home" id="app">
  <div class="progress">
    <button class="icon" id="back" aria-label="Choisir un autre jeu">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <div class="title" id="title">Espèces Corse</div>
    <div class="bar"><i id="bar"></i></div><div class="count" id="count">0 / 0</div>
    <button class="icon mode" id="mode" aria-label="Voir toutes les photos du jeu">
      <svg class="ic-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <svg class="ic-cards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/></svg>
    </button>
  </div>
  <div class="scroll decks" id="decks"></div>
  <div class="scroll gallery"><div class="grid" id="grid"></div></div>
  <div class="stage">
    <div class="card" id="card" role="button" aria-label="Retourner la carte">
      <div class="face front"><div class="blur" id="blur"></div><img id="img" alt=""><div class="credit" id="credit"></div>
        <button class="zoom-btn" id="zoomBtn" aria-label="Agrandir la photo"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
      </div>
      <div class="face back"><h1 id="name"></h1></div>
    </div>
  </div>
  <div class="actions">
    <button class="ko" id="ko">À revoir</button>
    <button class="ok" id="ok">Je connais</button>
  </div>
  <div class="end">
    <div class="score" id="score"></div>
    <div class="label" id="scoreLabel"></div>
    <button class="ko" id="retry">Revoir les ratées</button>
    <button class="alt" id="restart">Recommencer tout</button>
  </div>
</div>
<div class="viewer" id="viewer">
  <button class="icon close" id="vClose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="zoom" id="zoom"><img id="vImg" alt=""></div>
  <div class="credit" id="vCredit"></div>
  <h2 id="vName"></h2>
</div>
<script>
const CARDS = /*CARDS*/[
 {

// Jeux de cartes : chaque jeu liste des identifiants d'espèces (nom du fichier image).
const DECKS = [
  { name: 'Très communes', note: 'Vues à presque chaque plongée',
    ids: ['castagnole', 'girelle-commune', 'girelle-paon', 'serran-ecriture', 'sar-commun', 'sar-tete-noire',
          'saupe', 'etoile-de-mer-rouge', 'anemone-verte', 'posidonie', 'padine'] },
  { name: 'Communes', note: 'Souvent rencontrées',
    ids: ['merou-brun', 'murene', 'corb', 'rouget-de-roche', 'poulpe', 'spirographe', 'gorgone-rouge',
          'gorgone-jaune', 'ver-de-feu', 'flabelline', 'caulerpe'] },
  { name: 'Plus rares', note: 'À ne pas rater quand on les croise',
    ids: ['denti', 'barracuda', 'congre', 'rascasse-rouge', 'barbier', 'seiche', 'langouste-rouge',
          'cigale-de-mer', 'corail-rouge', 'grande-nacre', 'doris-dalmatien'] },
  { name: 'Toutes les espèces', note: 'Programme GP N4 Galeria', ids: null, cover: 'poulpe' },
];

const $ = id => document.getElementById(id);
const BY_ID = Object.fromEntries(CARDS.map(c => [c.img.replace(/^images\/|\.jpg$/g, ''), c]));
let deckCards = [], deck = [], pos = 0, missed = [];

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function start(cards) {
  deck = shuffle(cards); pos = 0; missed = [];
  $('app').classList.remove('done');
  show();
}

function show() {
  const c = deck[pos], card = $('card');
  card.classList.add('instant');
  card.classList.remove('flipped');
  $('img').src = c.img;
  $('blur').style.backgroundImage = `url("${c.img}")`;
  $('credit').textContent = '© ' + c.author;
  $('name').textContent = c.fr;
  card.offsetWidth; // force reflow so the next flip animates
  card.classList.remove('instant');
  $('count').textContent = `${pos + 1} / ${deck.length}`;
  $('bar').style.width = (pos / deck.length * 100) + '%';
  if (deck[pos + 1]) new Image().src = deck[pos + 1].img;
}

function answer(known) {
  if (!known) missed.push(deck[pos]);
  pos++;
  if (pos < deck.length) return show();
  $('bar').style.width = '100%';
  $('count').textContent = `${deck.length} / ${deck.length}`;
  const ok = deck.length - missed.length;
  $('score').textContent = `${ok} / ${deck.length}`;
  $('scoreLabel').textContent = missed.length ? `${missed.length} à revoir` : 'Tout est connu, bravo !';
  $('retry').style.display = missed.length ? '' : 'none';
  $('app').classList.add('done');
}

function openDeck(d) {
  deckCards = d.ids ? d.ids.map(id => BY_ID[id]) : CARDS;
  $('title').textContent = d.name;
  $('grid').replaceChildren(...deckCards.map(c => {
    const img = document.createElement('img');
    img.src = c.img; img.alt = ''; img.loading = 'lazy';
    img.addEventListener('click', () => openViewer(c, true));
    return img;
  }));
  $('app').classList.remove('home', 'browse');
  start(deckCards);
}

function goHome() {
  $('app').classList.remove('browse', 'done');
  $('app').classList.add('home');
  $('title').textContent = 'Espèces Corse';
}

DECKS.forEach(d => {
  const cards = d.ids ? d.ids.map(id => BY_ID[id]) : CARDS;
  const b = document.createElement('button');
  b.className = 'deck';
  b.innerHTML = `<img src="${(BY_ID[d.cover] || cards[0]).img}" alt=""><span><b></b><small></small></span>`;
  b.querySelector('b').textContent = d.name;
  b.querySelector('small').textContent = `${cards.length} cartes · ${d.note}`;
  b.addEventListener('click', () => openDeck(d));
  $('decks').appendChild(b);
});

$('card').addEventListener('click', () => $('card').classList.toggle('flipped'));
$('zoomBtn').addEventListener('click', e => { e.stopPropagation(); openViewer(deck[pos], false); });
$('ko').addEventListener('click', () => answer(false));
$('ok').addEventListener('click', () => answer(true));
$('retry').addEventListener('click', () => start(missed));
$('restart').addEventListener('click', () => start(deckCards));
$('back').addEventListener('click', goHome);
$('mode').addEventListener('click', () => {
  const browse = $('app').classList.toggle('browse');
  $('mode').setAttribute('aria-label', browse ? 'Revenir aux cartes' : 'Voir toutes les photos du jeu');
});
document.addEventListener('dblclick', e => e.preventDefault());

// Visionneuse : pincer pour zoomer, glisser pour se déplacer, double-toucher pour zoomer/dézoomer.
let z = { s: 1, x: 0, y: 0 };
const pts = new Map();
let gesture = null, lastTap = 0;

function openViewer(c, withName) {
  $('vImg').src = c.img;
  $('vName').textContent = c.fr;
  $('vCredit').textContent = '© ' + c.author;
  $('viewer').classList.toggle('nameless', !withName);
  $('viewer').classList.add('open');
  setZoom(1, 0, 0);
}
function setZoom(s, x, y) {
  const r = $('zoom').getBoundingClientRect();
  s = Math.min(6, Math.max(1, s));
  // keep the image covering the frame: no panning past its edges
  x = Math.min(0, Math.max(r.width * (1 - s), x));
  y = Math.min(0, Math.max(r.height * (1 - s), y));
  z = { s, x, y };
  $('vImg').style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
function local(e) { const r = $('zoom').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function snapshot() {
  const [a, b] = [...pts.values()];
  const mid = b ? { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } : a;
  return { mid, dist: b ? Math.hypot(a.x - b.x, a.y - b.y) : 0, z: { ...z } };
}
$('zoom').addEventListener('pointerdown', e => {
  $('zoom').setPointerCapture(e.pointerId);
  pts.set(e.pointerId, local(e));
  gesture = snapshot();
  if (pts.size === 1) {
    const now = Date.now();
    if (now - lastTap < 300) {
      const p = local(e), s = z.s > 1.2 ? 1 : 2.5;
      setZoom(s, p.x - (p.x - z.x) * s / z.s, p.y - (p.y - z.y) * s / z.s);
      lastTap = 0; gesture = null; return;
    }
    lastTap = now;
  }
});
$('zoom').addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, local(e));
  const now = snapshot(), g = gesture;
  const s = g.dist && now.dist ? g.z.s * now.dist / g.dist : g.z.s;
  // the image point under the initial midpoint stays under the current midpoint
  setZoom(s, now.mid.x - (g.mid.x - g.z.x) * s / g.z.s, now.mid.y - (g.mid.y - g.z.y) * s / g.z.s);
});
function release(e) { pts.delete(e.pointerId); gesture = pts.size ? snapshot() : null; }
$('zoom').addEventListener('pointerup', release);
$('zoom').addEventListener('pointercancel', release);
$('vClose').addEventListener('click', () => $('viewer').classList.remove('open'));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
