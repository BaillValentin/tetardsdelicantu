name: candidates
on:
  push:
    branches: [photos-candidates]
    paths: [tools/**, .github/workflows/candidates.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/candidates.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add candidates
          git commit -m "Candidate photos from Wikimedia Commons"
          git push
